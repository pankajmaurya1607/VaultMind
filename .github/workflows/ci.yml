name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  POETRY_VERSION: "1.8"

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: Run ruff linter
        run: ruff check app/ tests/

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: eka_user
          POSTGRES_PASSWORD: eka_pass
          POSTGRES_DB: eka_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U eka_user -d eka_test
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-timeout
      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://eka_user:eka_pass@localhost:5432/eka_test
          DATABASE_URL_SYNC: postgresql+psycopg2://eka_user:eka_pass@localhost:5432/eka_test
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci-0123456789abcdef
          ENVIRONMENT: testing
        run: |
          python -m pytest tests/ --timeout=60 --cov=app --cov-report=term-missing --cov-fail-under=60

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          tags: vaultmind/backend:latest
      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.worker
          push: false
          tags: vaultmind/worker:latest
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          tags: vaultmind/frontend:latest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Unit tests
        working-directory: frontend
        run: npm run test
      - name: Build
        working-directory: frontend
        run: npm run build

  compose-smoke:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - name: Create env file
        run: |
          cp .env.example .env
          echo "SECRET_KEY=smoke-test-secret-key-0123456789abcdef" >> .env
      - name: Start stack
        run: docker compose up -d --build backend celery_worker postgres redis
      - name: Wait for API health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 5
          done
          echo "API did not become healthy"; docker compose logs backend; exit 1
      - name: Seed reference data
        run: docker compose exec backend python seed_data.py
      - name: Smoke register -> login -> list documents
        run: |
          curl -fsS -X POST http://localhost:8000/api/v1/auth/register \
            -H "Content-Type: application/json" \
            -d '{"name":"Smoke","email":"smoke@example.com","password":"StrongPass123","department_id":1}' > /tmp/reg.json
          TOKEN=$(python3 -c "import json;print(json.load(open('/tmp/reg.json'))['access_token'])")
          curl -fsS http://localhost:8000/api/v1/documents?limit=5 -H "Authorization: Bearer $TOKEN" > /dev/null
          echo "Smoke flow OK"
      - name: Teardown
        if: always()
        run: docker compose down -v
