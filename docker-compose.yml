services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: eka_user
      POSTGRES_PASSWORD: eka_pass
      POSTGRES_DB: eka_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eka_user -d eka_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - internal

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Single-command deploy: migrate + seed (idempotent) + serve.
    command: sh -c "python migrate.py && python seed_data.py && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://eka_user:eka_pass@postgres:5432/eka_db
      DATABASE_URL_SYNC: postgresql+psycopg2://eka_user:eka_pass@postgres:5432/eka_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal
      - edge

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    env_file:
      - .env
    environment:
      DATABASE_URL_SYNC: postgresql+psycopg2://eka_user:eka_pass@postgres:5432/eka_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - edge

volumes:
  postgres_data:
  uploads:

networks:
  edge:
  internal:
