[project]
name = "enterprise-knowledge-assistant"
version = "1.0.0"
description = "Enterprise-grade RAG platform with RBAC, async pipelines, and AI orchestration"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "celery>=5.4.0",
    "redis>=5.1.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic-settings>=2.5.0",
    "langchain>=0.3.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
markers = [
    "unit: fast isolated tests (no external services)",
    "integration: tests requiring live Postgres/Redis",
    "security: security-focused tests (auth, injection, RBAC)",
    "ragas: RAG evaluation-quality tests",
    "docker: docker/compose configuration tests",
    "performance: latency/throughput assertions",
]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "*/migrations/*"]
